# Builds ticketwatch.exe on a real Windows machine.
#
# PyInstaller cannot cross-compile, so this is how you get a Windows .exe
# without owning a Windows dev setup.
#
# To get your .exe:
#   Actions tab -> "build-exe" -> Run workflow -> wait ~2 minutes ->
#   download the "ticketwatch-windows" artifact and unzip it.
#
# Pushing a tag like v1.0.0 also attaches the .exe to a GitHub release.
name: build-exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Check the tests pass before packaging anything
        run: python -m unittest discover -s tests -t .

      - name: Build ticketwatch.exe
        run: >
          python -m PyInstaller --clean --noconfirm
          --distpath dist --workpath build/pyinstaller
          packaging/ticketwatch.spec

      - name: Smoke test the executable
        run: |
          .\dist\ticketwatch.exe --version
          .\dist\ticketwatch.exe check --help

      - uses: actions/upload-artifact@v4
        with:
          name: ticketwatch-windows
          path: dist/ticketwatch.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ticketwatch.exe
